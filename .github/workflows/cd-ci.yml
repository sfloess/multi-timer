name: CD-CI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.event.pusher.email != 'version-bump@flossware.org'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .gitconfig for version bumps
      uses: oleksiyrudenko/gha-git-credentials@latest
      with:
        global: true
        name: 'Version Bump'
        email: 'version-bump@flossware.org'
        actor: 'VersionBump'
        token: '${{ secrets.GITHUB_TOKEN }}'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Swing JAR
      run: mvn -B clean package -DskipTests
      working-directory: swing

    - name: Verify JAR exists
      run: ls -la swing/target/multi-timer.jar

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify curses package
      working-directory: curses
      run: |
        pip install -e .
        python -c "import multi_timer; print('import OK')"

    - name: Increment version
      id: bump_version
      run: |
        CURRENT=$(cat VERSION | tr -d '[:space:]')
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        NEW_MINOR=$((MINOR + 1))
        NEW_VERSION="${MAJOR}.${NEW_MINOR}"
        echo "$NEW_VERSION" > VERSION
        echo "CURRENT_VERSION=$CURRENT" >> $GITHUB_OUTPUT
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Version: $CURRENT -> $NEW_VERSION"

    - name: Commit version bump and tag
      run: |
        git add VERSION
        git commit -m "chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}"
        git push
        git tag -a "v${{ steps.bump_version.outputs.NEW_VERSION }}" -m "Release v${{ steps.bump_version.outputs.NEW_VERSION }}"
        git push origin "v${{ steps.bump_version.outputs.NEW_VERSION }}"

    - name: Summary
      run: |
        echo "### Version Bump Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Old Version:** ${{ steps.bump_version.outputs.CURRENT_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version:** ${{ steps.bump_version.outputs.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The release workflow will be triggered automatically." >> $GITHUB_STEP_SUMMARY
