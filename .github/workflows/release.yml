name: Release

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "Releasing version: $VERSION"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build JAR
      run: mvn -B clean package -DskipTests
      working-directory: swing

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: swing-jar
        path: swing/target/multi-timer.jar
        retention-days: 5

  build-windows-exe:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Add NuGet packages for DB support
      working-directory: windows
      run: |
        dotnet add package Microsoft.Data.Sqlite --version 8.0.1
        dotnet add package Npgsql --version 8.0.1

    - name: Publish self-contained EXE
      working-directory: windows
      run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: windows/publish/MultiTimer.exe
        retention-days: 5

  build-curses:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build standalone binary
      working-directory: curses
      run: |
        pyinstaller --onefile --name multi-timer \
          --hidden-import multi_timer \
          --hidden-import multi_timer.app \
          --hidden-import multi_timer.models \
          --hidden-import multi_timer.persistence \
          --hidden-import multi_timer.config \
          --hidden-import multi_timer.database \
          --hidden-import multi_timer.settings_dialog \
          multi_timer/main.py 2>/dev/null || \
        pyinstaller --onefile --name multi-timer \
          --collect-all multi_timer \
          multi_timer/main.py

    - name: Upload curses artifact
      uses: actions/upload-artifact@v4
      with:
        name: curses-linux
        path: curses/dist/multi-timer
        retention-days: 5

  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set up EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Build Android APK
      run: eas build --platform android --profile production --non-interactive --local || eas build --platform android --profile preview --non-interactive

    - name: Find APK
      id: find_apk
      run: |
        APK=$(find . -name "*.apk" -type f | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" multi-timer.apk
          echo "APK_FOUND=true" >> $GITHUB_OUTPUT
        else
          echo "APK_FOUND=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK artifact
      if: steps.find_apk.outputs.APK_FOUND == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: multi-timer.apk
        retention-days: 5

  build-ios:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Install Apple Distribution Certificate
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.APPLE_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

    - name: Install Provisioning Profile
      uses: apple-actions/install-provisioning-profile@v1
      with:
        provisioning-profile-base64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

    - name: Build iOS app
      run: |
        cd swiftui
        xcodebuild clean archive \
          -scheme MultiTimer \
          -configuration Release \
          -archivePath build/MultiTimer.xcarchive \
          -sdk iphoneos \
          -allowProvisioningUpdates || true

    - name: Create export options
      run: |
        cd swiftui
        cat > ExportOptions.plist << PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>compileBitcode</key>
          <false/>
        </dict>
        </plist>
        PLIST

    - name: Export IPA
      id: export_ipa
      continue-on-error: true
      run: |
        cd swiftui
        xcodebuild -exportArchive \
          -archivePath build/MultiTimer.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist

    - name: Handle export failure
      if: steps.export_ipa.outcome == 'failure'
      run: |
        cd swiftui
        if [ -d build/MultiTimer.xcarchive ]; then
          echo "::warning::IPA export failed — likely due to code signing requirements"
          echo "iOS build completed. Signing required for distribution." > build/BUILD_INFO.txt
        fi

    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: |
          swiftui/build/*.ipa
          swiftui/build/BUILD_INFO.txt
        retention-days: 30

  create-release:
    needs: [build-jar, build-windows-exe, build-curses, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Extract version
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: swing-jar
        path: artifacts/swing-jar

    - name: Download Windows EXE artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-exe
        path: artifacts/windows-exe

    - name: Download curses artifact
      uses: actions/download-artifact@v4
      with:
        name: curses-linux
        path: artifacts/curses-linux

    - name: Download Android APK artifact
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: artifacts/android-apk

    - name: Download iOS artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        path: artifacts/ios-ipa

    - name: List artifacts
      run: find artifacts -type f

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.TAG }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/swing-jar/multi-timer.jar
          artifacts/windows-exe/MultiTimer.exe
          artifacts/curses-linux/multi-timer
          artifacts/android-apk/multi-timer.apk
          artifacts/ios-ipa/*.ipa
          artifacts/ios-ipa/BUILD_INFO.txt
        body: |
          ## Multi Timer ${{ steps.get_version.outputs.VERSION }}

          Cross-platform multi-timer application with SQLite & PostgreSQL support.

          ### Downloads

          | Platform | File | How to Run |
          |----------|------|------------|
          | **Java (all OS)** | `multi-timer.jar` | `java -jar multi-timer.jar` (Java 17+) |
          | **Windows** | `MultiTimer.exe` | Double-click to run (self-contained) |
          | **Linux (curses)** | `multi-timer` | `chmod +x multi-timer && ./multi-timer` |
          | **Android** | `multi-timer.apk` | Install APK on device |
          | **iOS** | See BUILD_INFO.txt | Open `swiftui/` in Xcode |

          ### Features
          - Multiple independent countdown timers
          - SQLite & PostgreSQL database support
          - Configuration UI for storage settings
          - Dark theme with modern styling
          - Add/Delete/Reorder timers
          - Timer notes and alarm notifications

          All code generated via FreeModelRouter with design/code/review/meta-review loop.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update latest tag
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -fa latest -m "Latest release: ${{ steps.get_version.outputs.VERSION }}"
        git push origin latest --force
